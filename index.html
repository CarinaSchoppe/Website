    <script>
        (() => {
            try {
                if (window.localStorage.getItem("carina_color_scheme_v2") === "night") {
                    document.documentElement.dataset.theme = "night";
                }
            } catch { /* Continue with the default appearance if storage is unavailable. */ }

            if (window.location.pathname !== "/") return;
            const params = new URLSearchParams(window.location.search);
            const soft404Path = params.get("__soft404");
            if (!soft404Path) return;

            try {
                const target = new URL(soft404Path, window.location.origin);
                if (target.origin === window.location.origin) {
                    window.history.replaceState(null, "", `${target.pathname}${target.search}${target.hash}`);
                }
            } catch {
                window.history.replaceState(null, "", "/");
            }
        })();
    </script>
