<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="noindex, follow" name="robots"/>
    <title>Seite nicht gefunden | Carina Sophie Schoppe</title>
    <script>
        (() => {
            const originalPath = `${window.location.pathname}${window.location.search}${window.location.hash}`;
            window.location.replace(`/?__soft404=${encodeURIComponent(originalPath)}`);
        })();
    </script>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: #050b12;
            color: #f8fafc;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
        }

        main {
            width: min(38rem, calc(100% - 2rem));
        }

        a {
            color: #67e8f9;
        }
    </style>
</head>
<body>
<main>
    <p>404</p>
    <h1>Huch, hier ist nichts.</h1>
    <p>Diese Adresse führt zu keiner Seite.</p>
    <p><a href="/">Zur Startseite</a></p>
</main>
</body>
</html>
